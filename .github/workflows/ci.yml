name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate shell syntax
        run: |
          bash -n bin/trustctl tests/test.sh
          sh -n install.sh

      - name: Run installer contract tests
        run: ./tests/test.sh

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck bin/trustctl install.sh tests/test.sh
